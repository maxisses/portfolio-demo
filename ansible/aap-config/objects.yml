---
# AAP configuration as code (no secrets). Applied by playbooks/aap-configure.yml.
# Everything here is visible in AAP, the portal and to the agent, so it is in English.
aap_url: https://aap.sandbox3481.opentlc.com
aap_org: Portfolio Demo
aap_project_repo: https://github.com/maxisses/portfolio-demo.git
aap_ee_image: quay.io/mdargatz/portfolio-demo-ee:1.1.0

# Humans, the agent and the hub automation. Passwords are generated by the playbook and kept
# in AWS Secrets Manager (portfolio-demo/aap/users).
aap_users:
  - username: max
    first_name: Max
    last_name: (Demo)
  - username: agent-claude
    first_name: Claude
    last_name: (Agent)
  - username: acm-automation
    first_name: ACM
    last_name: (Hub automation)

# Self-service catalog: job templates that humans (portal) and the agent (MCP) may run.
# The portal builds its forms from the surveys; the agent sees the same fields as parameters.
aap_catalog_templates:
  - name: "Catalog: Namespace"
    description: New OpenShift namespace with quota and team access, on the hub or at the edge. Delivered through Git and Argo CD.
    playbook: ansible/playbooks/catalog-namespace.yml
    credentials: [cred_deploykey, cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: ns_name, question_name: Namespace name, question_description: "lowercase letters, digits, dashes", type: text, required: true, min: 2, max: 42 }
      - { variable: team, question_name: Team, type: text, required: true, default: demo, min: 2, max: 22 }
      - { variable: target_cluster, question_name: Target cluster, type: multiplechoice, choices: [portfolio-hub, ocp19, ocp20], default: portfolio-hub, required: true }

  - name: "Catalog: Model Endpoint"
    description: API key, URL and model name for a model behind Models-as-a-Service (self-hosted Granite or an external model).
    playbook: ansible/playbooks/catalog-model-endpoint.yml
    credentials: [cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: model, question_name: Model, type: multiplechoice, choices: [granite, claude-haiku-4-5, claude-sonnet-5-5, claude-opus-5-5, gpt-6-luna], default: granite, required: true }
      - { variable: team, question_name: Team, type: text, required: true, default: demo, min: 2, max: 22 }

  - name: "Catalog: AI Namespace"
    description: Data science project on OpenShift AI with a workbench (optionally with a GPU), sample notebooks and pre-wired access to Models-as-a-Service.
    playbook: ansible/playbooks/catalog-ai-namespace.yml
    credentials: [cred_deploykey, cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: ns_name, question_name: AI namespace name, question_description: "lowercase letters, digits, dashes", type: text, required: true, min: 2, max: 42 }
      - { variable: team, question_name: Team, type: text, required: true, default: ai, min: 2, max: 22 }
      - { variable: gpu, question_name: "GPU workbench (NVIDIA L4, PyTorch) for training and fine-tuning", type: multiplechoice, choices: ["no", "yes"], default: "no", required: true }

  - name: "Catalog: Deploy App (Localnews)"
    description: Golden path for app teams. Deploys Localnews into a namespace on the hub, optionally with AI (Granite via MaaS) and a managed database ordered before.
    playbook: ansible/playbooks/catalog-app-localnews.yml
    credentials: [cred_deploykey, cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: namespace, question_name: Namespace (on portfolio-hub), type: text, required: true, min: 2, max: 42 }
      - { variable: ai, question_name: "AI location extraction via MaaS", type: multiplechoice, choices: ["yes", "no"], default: "yes", required: true }
      - { variable: database, question_name: "Database (name of an ordered database, empty = built-in)", type: text, required: false, default: "", max: 31 }

  - name: "Operations: Clean Up Catalog"
    description: Removes all namespaces, AI namespaces, apps and databases ordered through the catalog (except the ones listed). Platform operations only.
    playbook: ansible/playbooks/cleanup.yml
    credentials: [cred_deploykey, cred_tfstate]
    execute: []
    survey:
      - { variable: keep, question_name: "Namespaces to keep (comma separated, empty = remove all)", type: text, required: false, default: "" }

  # Operations: started by ACM (PolicyAutomation, ClusterCurator hooks); ACM passes the variables
  - name: "Compliance: Record Violation"
    description: Started by ACM when a policy is violated. Writes a report into the repository (docs/compliance).
    playbook: ansible/playbooks/compliance-report.yml
    credentials: [cred_deploykey, cred_hub]
    execute: [acm-automation, max]
    ask_variables: true
  - name: "Edge: Pre-Upgrade Check"
    description: Checks an edge cluster through the hub before an upgrade (availability, version, Localnews).
    playbook: ansible/playbooks/edge-check.yml
    credentials: [cred_hub]
    execute: [acm-automation, max, agent-claude]
    ask_variables: true
  - name: "Edge: Post-Upgrade Smoke Test"
    description: Checks an edge cluster after an upgrade (expected version, Localnews healthy).
    playbook: ansible/playbooks/edge-check.yml
    credentials: [cred_hub]
    execute: [acm-automation, max, agent-claude]
    ask_variables: true

# Workflows with approval: the requester only sees the workflow; the executing template is
# internal (not in the catalog), the admin approves.
aap_catalog_workflows:
  - name: "Catalog: Database"
    description: PostgreSQL (Amazon RDS, with PostGIS) for a namespace on the hub. Billed per hour, so it needs approval. AAP runs Terraform for it.
    approval: { name: "Approval: Database (billed per hour)", description: "Amazon RDS instance, billed per hour", timeout: 0 }
    job_template:
      name: "Database (internal execution)"
      description: Terraform run for the catalog item Database; only started from the workflow.
      playbook: ansible/playbooks/catalog-dbaas.yml
      credentials: [cred_deploykey, cred_hub, cred_tfstate]
    execute: [max, agent-claude]
    survey:
      - { variable: db_name, question_name: Database name, type: text, required: true, min: 2, max: 31 }
      - { variable: size, question_name: Size, type: multiplechoice, choices: [small, medium], default: small, required: true }
      - { variable: namespace, question_name: Target namespace (on portfolio-hub), type: text, required: true, min: 2, max: 42 }
  - name: "Operations: Edge Upgrade"
    description: Upgrades edge clusters through ACM (ClusterCurator) with an AAP pre-upgrade check and smoke test. Needs approval; dry run available.
    approval: { name: "Approval: Edge Upgrade", description: "Edge clusters get upgraded and reboot", timeout: 0 }
    job_template:
      name: "Edge Upgrade (internal execution)"
      description: Creates the ClusterCurators; only started from the workflow.
      playbook: ansible/playbooks/edge-upgrade.yml
      credentials: [cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: cluster, question_name: Edge cluster, type: multiplechoice, choices: [all, ocp19, ocp20], default: all, required: true }
      - { variable: version, question_name: Target version, type: text, default: "4.22.15", required: true, min: 4, max: 12 }
      - { variable: dry_run, question_name: "Dry run (show only)", type: multiplechoice, choices: ["yes", "no"], default: "yes", required: true }

# Objects with the earlier German names and the AAP sample template; removed so AAP and the
# portal show only the catalog.
aap_retired:
  job_templates:
    - "Demo Job Template"
    - "Katalog: Namespace"
    - "Katalog: Model-Endpoint"
    - "Katalog: AI-Namespace"
    - "Katalog: App bereitstellen (Localnews)"
    - "Betrieb: Katalog aufräumen"
    - "Compliance: Verstoß dokumentieren"
    - "Edge: Vorab-Check"
    - "Edge: Smoke-Test"
    - "Datenbank (Ausführung, intern)"
    - "Edge-Upgrade (Ausführung, intern)"
    - "Terraform: Plan (Drift-Check)"
  workflow_job_templates:
    - "Katalog: Datenbank"
    - "Betrieb: Edge-Upgrade"
