---
# AAP-Konfiguration als Code (ohne Secrets). Umgesetzt von playbooks/aap-configure.yml.
aap_url: https://aap.sandbox3481.opentlc.com
aap_org: Portfolio Demo
aap_project_repo: https://github.com/maxisses/portfolio-demo.git
aap_ee_image: quay.io/mdargatz/portfolio-demo-ee:1.1.0

# Menschen und Agent. Passwörter erzeugt das Playbook, sie liegen in
# AWS Secrets Manager unter portfolio-demo/aap/users.
aap_users:
  - username: max
    first_name: Max
    last_name: (Demo)
  - username: agent-claude
    first_name: Claude
    last_name: (Agent)

# Katalog: Job-Templates, die Menschen (Portal) und der Agent (MCP) ausführen dürfen.
# Aus dem Survey baut das Portal das Formular; der Agent sieht dieselben Felder als Parameter.
aap_catalog_templates:
  - name: "Katalog: Namespace"
    description: Neuer OpenShift-Namespace mit Quota und Team-Rechten, auf dem Hub oder am Edge. Läuft über Git und Argo CD.
    playbook: ansible/playbooks/catalog-namespace.yml
    credentials: [cred_deploykey, cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: ns_name, question_name: Name des Namespace, question_description: "Kleinbuchstaben, Ziffern, Bindestriche", type: text, required: true, min: 2, max: 42 }
      - { variable: team, question_name: Team, type: text, required: true, default: demo, min: 2, max: 22 }
      - { variable: target_cluster, question_name: Zielcluster, type: multiplechoice, choices: [portfolio-hub, ocp19, ocp20], default: portfolio-hub, required: true }
  - name: "Katalog: Model-Endpoint"
    description: API-Key, URL und Modellname für ein Modell aus Models-as-a-Service (eigenes Granite oder extern Claude Haiku).
    playbook: ansible/playbooks/catalog-model-endpoint.yml
    credentials: [cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: model, question_name: Modell, type: multiplechoice, choices: [granite, claude-haiku-4-5], default: granite, required: true }
      - { variable: team, question_name: Team, type: text, required: true, default: demo, min: 2, max: 22 }
  - name: "Katalog: AI-Namespace"
    description: Data-Science-Projekt auf OpenShift AI mit Workbench, Beispiel-Notebooks und vorverdrahtetem Zugang zu Models-as-a-Service.
    playbook: ansible/playbooks/catalog-ai-namespace.yml
    credentials: [cred_deploykey, cred_hub]
    execute: [max, agent-claude]
    survey:
      - { variable: ns_name, question_name: Name des AI-Namespace, question_description: "Kleinbuchstaben, Ziffern, Bindestriche", type: text, required: true, min: 2, max: 42 }
      - { variable: team, question_name: Team, type: text, required: true, default: ai, min: 2, max: 22 }

# Workflows mit Freigabe: Der Besteller sieht nur den Workflow; das ausführende Template
# ist intern (nicht im Katalog), freigeben kann der Admin.
aap_catalog_workflows:
  - name: "Katalog: Datenbank"
    description: PostgreSQL (Amazon RDS) für einen Namespace auf dem Hub. Kostet Geld, deshalb mit Freigabe. AAP ruft dafür Terraform auf.
    approval: { name: "Freigabe: Datenbank (kostenpflichtig)", description: "RDS-Instanz in AWS, wird pro Stunde abgerechnet", timeout: 0 }
    job_template:
      name: "Datenbank (Ausführung, intern)"
      description: Terraform-Lauf für das Katalog-Item Datenbank; wird nur aus dem Workflow gestartet.
      playbook: ansible/playbooks/catalog-dbaas.yml
      credentials: [cred_deploykey, cred_hub, cred_tfstate]
    execute: [max, agent-claude]
    survey:
      - { variable: db_name, question_name: Name der Datenbank, type: text, required: true, min: 2, max: 31 }
      - { variable: groesse, question_name: Größe, type: multiplechoice, choices: [klein, mittel], default: klein, required: true }
      - { variable: namespace, question_name: Ziel-Namespace (auf portfolio-hub), type: text, required: true, min: 2, max: 42 }
