---
# Execution Environment für die Portfolio-Demo.
# Das Standard-EE von AAP enthält aus Lizenzgründen kein Terraform-Binary,
# deshalb bauen wir es hier selbst ein (für cloud.terraform).
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9:1789578939

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.16
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_files:
  - src: install-terraform.sh
    dest: scripts

additional_build_steps:
  append_final:
    - COPY _build/scripts/install-terraform.sh /tmp/install-terraform.sh
    - RUN bash /tmp/install-terraform.sh 1.16.4 && rm /tmp/install-terraform.sh
    - RUN terraform version

options:
  package_manager_path: /usr/bin/microdnf
