---
# Catalog item "Model Endpoint": issues an API key for a model through the MaaS API.
# The identity is AAP's service account on the hub (credential "Hub-API"); the subscription
# defines tier and token limit (standard = own model, premium = external models as well).
- name: Order a model endpoint
  hosts: localhost
  gather_facts: false
  vars:
    model: granite
    tier_labels: { standard: "Local", premium: "Local + public" }
    team: demo
    valid_for: 7d
    maas_url: https://maas.apps.rosa.portfolio-hub.vnid.p3.openshiftapps.com
    models:
      granite: { id: "publishers/ai-engineering/models/granite", subscription: standard, description: "self-hosted on OpenShift AI (llm-d, GPU)" }
      claude-haiku-4-5: { id: claude-haiku-4-5, subscription: premium, description: "external via the Anthropic API (Technology Preview)" }
      claude-sonnet-5-5: { id: claude-sonnet-5-5, subscription: premium, description: "external via the Anthropic API (Technology Preview)" }
      claude-opus-5-5: { id: claude-opus-5-5, subscription: premium, description: "external via the Anthropic API (Technology Preview)" }
      gpt-6-luna: { id: gpt-6-luna, subscription: premium, description: "external via the OpenAI API (Technology Preview)" }
    requester: "{{ tower_user_name | default('local') }}"
    channel: "{{ 'agent' if requester is match('^agent-') else 'portal' }}"
    request_id: "{{ tower_job_id | default('local') }}"
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - model in models
          - team is match('^[a-z0-9]([-a-z0-9]{0,20}[a-z0-9])?$')
        fail_msg: "Model: {{ models.keys() | join(', ') }}; team: lowercase letters, digits, dashes"

    - name: Issue an API key at MaaS
      ansible.builtin.uri:
        url: "{{ maas_url }}/maas-api/v1/api-keys"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
        body_format: json
        body:
          name: "{{ team }}-{{ model }}-{{ request_id }}"
          subscription: "{{ models[model].subscription }}"
          expiresIn: "{{ valid_for }}"
        status_code: [200, 201]
      register: key
      no_log: true

    - name: Result for portal and agent
      ansible.builtin.set_stats:
        data:
          base_url: "{{ maas_url }}/v1"
          model: "{{ models[model].id }}"
          api_key: "{{ key.json.key }}"
          subscription: "{{ tier_labels[models[model].subscription] }}"
          valid_for: "{{ valid_for }}"
          usage: "OpenAI compatible: POST {{ maas_url }}/v1/chat/completions with 'Authorization: Bearer <api_key>'"
          ordered_by: "{{ requester }} via {{ channel }}"
      no_log: true

    - name: Summary
      ansible.builtin.debug:
        msg: "Key for {{ models[model].id }} ({{ models[model].description }}), tier {{ tier_labels[models[model].subscription] }}, valid for {{ valid_for }}. Endpoint: {{ maas_url }}/v1"
