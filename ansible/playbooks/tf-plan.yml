---
# Drift check: terraform plan for a module from terraform/<tf_dir> against the state in S3.
# Runs in AAP in the EE portfolio-demo-ee; AWS permissions come from the AAP VM's role,
# the backend configuration from the credential "Terraform State (S3)".
- name: Terraform Plan
  hosts: localhost
  gather_facts: false
  vars:
    tf_dir: foundation
    tf_variables: {}
  tasks:
    - name: "terraform plan: {{ tf_dir }}"
      cloud.terraform.terraform:
        project_path: "{{ playbook_dir }}/../../terraform/{{ tf_dir }}"
        binary_path: /usr/local/bin/terraform
        state: present
        force_init: true
        backend_config_files:
          - "{{ lookup('ansible.builtin.env', 'TF_BACKEND_CONFIG_FILE') }}"
        backend_config:
          key: "{{ tf_dir }}/terraform.tfstate"
        variables: "{{ tf_variables }}"
      check_mode: true
      register: plan

    - name: Result
      ansible.builtin.debug:
        msg: "{{ tf_dir }}: {{ 'drift found, details in the plan above' if plan.changed else 'no drift between code and AWS' }}"
