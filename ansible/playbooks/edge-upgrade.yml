---
# "Operations: Edge Upgrade" (execution, after approval): creates one ClusterCurator per edge
# cluster. ACM then calls the AAP pre-upgrade check, upgrades the cluster and calls the AAP
# smoke test afterwards. With dry_run=yes it only shows what would happen.
- name: Orchestrate an edge upgrade
  hosts: localhost
  gather_facts: false
  vars:
    cluster: all
    version: "4.22.15"
    channel: stable-4.22
    dry_run: "yes"
  tasks:
    - name: Determine target clusters
      ansible.builtin.set_fact:
        targets: "{{ ['ocp19', 'ocp20'] if cluster == 'all' else [cluster] }}"
        show_only: "{{ dry_run | string | lower in ['yes', 'true', '1'] }}"

    - name: Pre-check per cluster (availability, current version)
      kubernetes.core.k8s_info:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ item }}"
      loop: "{{ targets }}"
      register: mcs

    - name: Overview
      ansible.builtin.debug:
        msg: "{{ item.item }}: currently {{ (item.resources[0].status.clusterClaims | default([]) | selectattr('name', 'equalto', 'version.openshift.io') | map(attribute='value') | first) | default('unknown') }} -> target {{ version }}"
      loop: "{{ mcs.results }}"
      loop_control: { label: "{{ item.item }}" }

    - name: ClusterCurator per cluster
      ansible.builtin.set_fact:
        curators: "{{ curators | default([]) + [curator] }}"
      loop: "{{ targets }}"
      vars:
        curator:
          apiVersion: cluster.open-cluster-management.io/v1beta1
          kind: ClusterCurator
          metadata:
            name: "{{ item }}"
            namespace: "{{ item }}"
            labels: { portfolio-demo/managed-by: aap, portfolio-demo/request-id: "{{ tower_workflow_job_id | default(tower_job_id) | default('local') }}" }
          spec:
            desiredCuration: upgrade
            upgrade:
              desiredUpdate: "{{ version }}"
              channel: "{{ channel }}"
              monitorTimeout: 120
              towerAuthSecret: aap-tower
              prehook:
                - name: "Edge: Pre-Upgrade Check"
                  extra_vars: { cluster: "{{ item }}", check: pre }
              posthook:
                - name: "Edge: Post-Upgrade Smoke Test"
                  extra_vars: { cluster: "{{ item }}", check: post, expected_version: "{{ version }}" }

    - name: Dry run, show only
      when: show_only | bool
      ansible.builtin.debug:
        msg: "{{ curators | to_nice_yaml }}"

    - name: Start the upgrade (ACM takes over)
      when: not (show_only | bool)
      kubernetes.core.k8s:
        state: present
        apply: true
        definition: "{{ item }}"
      loop: "{{ curators }}"
      loop_control: { label: "{{ item.metadata.name }}" }

    - name: Result
      ansible.builtin.set_stats:
        data:
          clusters: "{{ targets }}"
          target_version: "{{ version }}"
          mode: "{{ 'dry run, nothing changed' if show_only | bool else 'upgrade started, ACM runs pre-check, upgrade and smoke test' }}"
