---
# Prüft einen Edge-Cluster über den Hub (ohne VPN): ManagedCluster verfügbar, OpenShift-Version,
# Localnews synchron und gesund. Als "Edge: Vorab-Check" vor dem Upgrade (pruefung=vorab) und
# als "Edge: Smoke-Test" danach (pruefung=nachher, mit erwarteter Version). ACM startet beide
# als Hooks des ClusterCurator; manuell geht es genauso.
- name: Edge-Cluster prüfen
  hosts: localhost
  gather_facts: false
  vars:
    cluster: ""
    pruefung: vorab
    erwartete_version: ""
  tasks:
    - name: Cluster-Name aus dem Hook (ACM übergibt cluster_deployment)
      ansible.builtin.set_fact:
        ziel: "{{ cluster or (cluster_deployment.name | default('')) }}"

    - name: ManagedCluster
      kubernetes.core.k8s_info:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ ziel }}"
      register: mc
      failed_when: mc.resources | length == 0

    - name: Zustand auswerten
      ansible.builtin.set_fact:
        verfuegbar: "{{ (mc.resources[0].status.conditions | selectattr('type', 'equalto', 'ManagedClusterConditionAvailable') | first).status == 'True' }}"
        version: "{{ (mc.resources[0].status.clusterClaims | default([]) | selectattr('name', 'equalto', 'version.openshift.io') | map(attribute='value') | first) | default('unbekannt') }}"

    - name: Localnews auf dem Cluster (Status aus dem Pull-Modell)
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "localnews-{{ ziel }}"
      register: app

    - name: Bewertung
      ansible.builtin.assert:
        that:
          - verfuegbar | bool
          - pruefung != 'nachher' or not erwartete_version or version == erwartete_version
          - app.resources | length == 0 or app.resources[0].status.health.status | default('') in ['Healthy', 'Progressing']
        fail_msg: "{{ ziel }}: verfügbar={{ verfuegbar }}, Version {{ version }}, Localnews {{ app.resources[0].status.health.status | default('-') if app.resources else 'nicht vorhanden' }}"
        success_msg: "{{ ziel }} ok: verfügbar, Version {{ version }}, Localnews {{ app.resources[0].status.health.status | default('-') if app.resources else 'nicht vorhanden' }}"

    - name: Ergebnis
      ansible.builtin.set_stats:
        data:
          cluster: "{{ ziel }}"
          pruefung: "{{ pruefung }}"
          version: "{{ version }}"
