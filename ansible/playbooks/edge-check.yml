---
# Checks an edge cluster through the hub (no VPN): ManagedCluster available, OpenShift
# version, Localnews synced and healthy. As "Edge: Pre-Upgrade Check" before the upgrade
# (check=pre) and as "Edge: Post-Upgrade Smoke Test" afterwards (check=post, with the expected
# version). ACM starts both as ClusterCurator hooks; running them by hand works the same way.
- name: Check an edge cluster
  hosts: localhost
  gather_facts: false
  vars:
    cluster: ""
    check: pre
    expected_version: ""
  tasks:
    - name: Cluster name from the hook (ACM passes cluster_deployment)
      ansible.builtin.set_fact:
        target: "{{ cluster or (cluster_deployment.name | default('')) }}"

    - name: ManagedCluster
      kubernetes.core.k8s_info:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ target }}"
      register: mc
      failed_when: mc.resources | length == 0

    - name: Evaluate state
      ansible.builtin.set_fact:
        available: "{{ (mc.resources[0].status.conditions | selectattr('type', 'equalto', 'ManagedClusterConditionAvailable') | first).status == 'True' }}"
        current_version: "{{ (mc.resources[0].status.clusterClaims | default([]) | selectattr('name', 'equalto', 'version.openshift.io') | map(attribute='value') | first) | default('unknown') }}"

    - name: Localnews on the cluster (status from the pull model)
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "localnews-{{ target }}"
      register: app

    - name: Verdict
      ansible.builtin.assert:
        that:
          - available | bool
          - check != 'post' or not expected_version or current_version == expected_version
          - app.resources | length == 0 or app.resources[0].status.health.status | default('') in ['Healthy', 'Progressing']
        fail_msg: "{{ target }}: available={{ available }}, version {{ current_version }}, Localnews {{ app.resources[0].status.health.status | default('-') if app.resources else 'not deployed' }}"
        success_msg: "{{ target }} ok: available, version {{ current_version }}, Localnews {{ app.resources[0].status.health.status | default('-') if app.resources else 'not deployed' }}"

    - name: Result
      ansible.builtin.set_stats:
        data:
          cluster: "{{ target }}"
          check: "{{ check }}"
          version: "{{ current_version }}"
