---
# One workflow from ansible/orchestrator-config: insert the instance-specific IDs, create or
# update it (an update creates a new version), publish the newest version.
- name: "Definition {{ wf.file }}"
  ansible.builtin.set_fact:
    wf_def: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../orchestrator-config/' ~ wf.file)
         | replace('__AAP_INTEGRATION_ID__', aap_int_id) | replace('__AAP_CREDENTIAL_ID__', aap_cred_id)
         | replace('__LLM_CREDENTIAL_ID__', llm_cred_id) | replace('__LLM_MODEL_ID__', llm_model_id)
         | replace('__SERVICE_ACCOUNT_ID__', sa_id) | from_json }}

- name: Existing workflow with this name
  ansible.builtin.set_fact:
    wf_existing: "{{ wfs.json.resources | selectattr('name', 'equalto', wf_def.name) | list }}"

- name: Create
  when: wf_existing | length == 0
  ansible.builtin.uri:
    url: "{{ orchestrator_url }}/api/v1/workflows"
    method: POST
    headers: "{{ ao_headers }}"
    body_format: json
    body: { name: "{{ wf_def.name }}", description: "{{ wf_def.description }}", project_id: "{{ project_id }}", workflow_definition: "{{ wf_def }}" }
    status_code: [200, 201]
  register: wf_created

- name: Current definition
  when: wf_existing | length > 0
  ansible.builtin.uri:
    url: "{{ orchestrator_url }}/api/v1/workflows/{{ wf_existing[0].id }}"
    headers: "{{ ao_headers }}"
  register: wf_current

- name: Update (new version) when the definition in Git differs
  when: wf_existing | length > 0 and (wf_current.json.workflow_definition | default({})) != wf_def
  ansible.builtin.uri:
    url: "{{ orchestrator_url }}/api/v1/workflows/{{ wf_existing[0].id }}"
    method: PATCH
    headers: "{{ ao_headers }}"
    body_format: json
    body: { workflow_definition: "{{ wf_def }}", change_description: "Updated from Git (ansible/orchestrator-config/{{ wf.file }})" }
  register: wf_updated

- name: Workflow state
  ansible.builtin.uri:
    url: "{{ orchestrator_url }}/api/v1/workflows/{{ wf_created.json.id if wf_existing | length == 0 else wf_existing[0].id }}"
    headers: "{{ ao_headers }}"
  register: wf_state

- name: Publish the newest version
  when: wf_state.json.published_version | default(none) != wf_state.json.current_version
  ansible.builtin.uri:
    url: "{{ orchestrator_url }}/api/v1/workflows/{{ wf_state.json.id }}/versions/{{ wf_state.json.current_version }}/publish"
    method: POST
    headers: "{{ ao_headers }}"
    body_format: json
    body: { name: "v{{ wf_state.json.current_version }}", change_description: "Published from Git" }
