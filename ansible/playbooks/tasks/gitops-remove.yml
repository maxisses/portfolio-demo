---
# Removes generated tenant files (all *.yaml under gitops/tenants/, except "keep").
- name: Store the deploy key from the credential as a file
  ansible.builtin.copy:
    dest: "{{ gitops_workdir }}-key"
    content: "{{ (lookup('ansible.builtin.env', 'GIT_DEPLOY_KEY_B64') | b64decode | trim) ~ '\n' }}"
    mode: "0600"
  no_log: true

- name: Remove generated tenants and push
  ansible.builtin.shell: |
    set -e
    git clone -q --depth 20 {{ gitops_repo_ssh }} {{ gitops_workdir }}
    cd {{ gitops_workdir }}
    git config user.name "Ansible Automation Platform"
    git config user.email "aap@portfolio-demo.invalid"
    for f in gitops/tenants/*/*.yaml; do
      [ -e "$f" ] || continue
      base="$(basename "$f" .yaml)"; ns="${base%%-db-*}"; ns="${ns%%-app-*}"
      case " {{ keep_list | join(' ') }} " in *" $ns "*) continue ;; esac
      git rm -q "$f"
    done
    git diff --cached --quiet && { echo "nothing to remove"; exit 0; }
    git commit -q -m "Clean up: removed generated tenants (AAP job {{ tower_job_id | default('local') }})"
    for i in 1 2 3 4 5; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
    echo "removed"
  environment:
    GIT_SSH_COMMAND: "ssh -i {{ gitops_workdir }}-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
  register: rm
  changed_when: "'removed' in rm.stdout"
