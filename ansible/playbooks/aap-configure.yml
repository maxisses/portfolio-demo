---
# Konfiguriert AAP als Code über die REST-API (idempotent):
# Organisation, Nutzer, Credential-Typen, Credentials, EE, Inventory, Projekt, Job-Templates, RBAC.
# Secrets kommen aus AWS Secrets Manager bzw. local/ und landen nur in AAP, nie in Git.
- name: AAP konfigurieren
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../aap-config/objects.yml
  vars:
    repo_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Admin-Passwort
      ansible.builtin.set_fact:
        aap_admin_password: "{{ (lookup('ansible.builtin.pipe', 'aws secretsmanager get-secret-value --secret-id portfolio-demo/aap/installer --query SecretString --output text') | from_json).admin_password }}"
        account_id: "{{ lookup('ansible.builtin.pipe', 'aws sts get-caller-identity --query Account --output text') }}"
      no_log: true

    - name: Nutzer-Passwörter lesen, fehlende einmalig erzeugen
      # Jeder Nutzer aus aap_users bekommt ein Passwort; vorhandene bleiben unverändert.
      ansible.builtin.shell: |
        set -e
        old=$(aws secretsmanager get-secret-value --secret-id portfolio-demo/aap/users --query SecretString --output text 2>/dev/null || echo '')
        new=$(OLD="$old" python3 -c 'import json,os,secrets,sys; d=json.loads(os.environ["OLD"] or "{}"); [d.setdefault(u, secrets.token_urlsafe(15)) for u in sys.argv[1:]]; print(json.dumps(d))' {{ aap_users | map(attribute='username') | join(' ') }})
        if [ -z "$old" ]; then
          aws secretsmanager create-secret --name portfolio-demo/aap/users --secret-string "$new" >/dev/null
        elif [ "$old" != "$new" ]; then
          aws secretsmanager put-secret-value --secret-id portfolio-demo/aap/users --secret-string "$new" >/dev/null
        fi
        echo "$new"
      register: _users
      changed_when: false
      no_log: true

    - name: Passwörter merken
      ansible.builtin.set_fact:
        user_passwords: "{{ _users.stdout | from_json }}"
      no_log: true

    # --- Gateway: Organisation und Nutzer ---------------------------------
    - name: Organisation
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure: { key: org, api: gateway, endpoint: organizations, query: "name={{ aap_org | urlencode }}", body: { name: "{{ aap_org }}", description: "Self-service catalog of the portfolio demo" } }

    - name: Nutzer
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      loop: "{{ aap_users }}"
      vars:
        ensure:
          key: "user_{{ item.username }}"
          api: gateway
          endpoint: users
          query: "username={{ item.username }}"
          no_log: true
          body: "{{ item | combine({'password': user_passwords[item.username], 'is_superuser': false}) }}"

    # --- Controller: Credential-Typ für Git-Push mit Deploy Key -------------
    - name: Rollen-Definition "Organization Member"
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/gateway/v1/role_definitions/?name={{ 'Organization Member' | urlencode }}"
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
      register: _rd_member

    - name: Portal-Nutzer werden Mitglied der Organisation (sonst lehnt das Portal die Anmeldung ab)
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/gateway/v1/role_user_assignments/"
        method: POST
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          role_definition: "{{ _rd_member.json.results[0].id }}"
          user: "{{ aap_ids['user_' ~ item.username] }}"
          object_id: "{{ aap_ids.org | string }}"
        status_code: [200, 201, 400]
      loop: "{{ aap_users | selectattr('portal', 'defined') | selectattr('portal') | list }}"
      loop_control: { label: "{{ item.username }}" }
      changed_when: false

    - name: Credential-Typ "Git Deploy Key"
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure:
          key: ctype_deploykey
          api: controller
          endpoint: credential_types
          query: "name={{ 'Git Deploy Key' | urlencode }}"
          create_only: [inputs, injectors]
          body:
            name: Git Deploy Key
            kind: cloud
            description: SSH key that jobs use to push generated YAML to Git
            inputs:
              fields:
                - { id: ssh_key_b64, type: string, label: Private key (base64), secret: true }
              required: [ssh_key_b64]
            injectors:
              # Base64 in einer Umgebungsvariable statt Datei-Injector: mehrzeilige Schlüssel
              # kamen über den Datei-Injector nicht formatgetreu an. Das Playbook schreibt die Datei.
              env:
                GIT_DEPLOY_KEY_B64: "{{ '{{' }} ssh_key_b64 {{ '}}' }}"

    - name: Credential-Typ-IDs der eingebauten Typen
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/credential_types/?name={{ item | urlencode }}"
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
      loop: [Terraform backend configuration]
      register: _builtin_types

    - name: Credentials
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      loop:
        - key: cred_deploykey
          name: GitHub Deploy Key (portfolio-demo)
          credential_type: "{{ aap_ids.ctype_deploykey }}"
          inputs: { ssh_key_b64: "{{ lookup('ansible.builtin.file', repo_root ~ '/local/github-deploy-key') | b64encode }}" }
        - key: cred_tfstate
          name: Terraform State (S3)
          credential_type: "{{ _builtin_types.results[0].json.results[0].id }}"
          inputs:
            configuration: |
              bucket       = "portfolio-demo-tfstate-{{ account_id }}"
              region       = "eu-central-1"
              use_lockfile = true
              encrypt      = true
      loop_control: { label: "{{ item.name }}" }
      vars:
        ensure:
          key: "{{ item.key }}"
          api: controller
          endpoint: credentials
          query: "name={{ item.name | urlencode }}"
          no_log: true
          body: { name: "{{ item.name }}", organization: "{{ aap_ids.org }}", credential_type: "{{ item.credential_type }}", inputs: "{{ item.inputs }}" }

    - name: Token des AAP-ServiceAccounts vom Hub lesen
      ansible.builtin.set_fact:
        hub_token: "{{ lookup('ansible.builtin.pipe', 'oc --kubeconfig ' ~ repo_root ~ '/local/kubeconfig get secret aap-token -n aap-automation -o jsonpath={.data.token}') | b64decode }}"
        hub_api: "{{ lookup('ansible.builtin.pipe', 'oc --kubeconfig ' ~ repo_root ~ '/local/kubeconfig whoami --show-server') }}"
      no_log: true

    - name: ID des Credential-Typs für OpenShift/Kubernetes
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/credential_types/?namespace=kubernetes_bearer_token"
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
      register: _k8s_type

    - name: Credential "Hub-API (portfolio-hub)"
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure:
          key: cred_hub
          api: controller
          endpoint: credentials
          query: "name={{ 'Hub-API (portfolio-hub)' | urlencode }}"
          no_log: true
          body: { name: "Hub-API (portfolio-hub)", organization: "{{ aap_ids.org }}", credential_type: "{{ _k8s_type.json.results[0].id }}", inputs: { host: "{{ hub_api }}", bearer_token: "{{ hub_token }}", verify_ssl: true } }

    # --- Controller: EE, Inventory, Projekt -------------------------------
    - name: Execution Environment
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure: { key: ee, api: controller, endpoint: execution_environments, query: "name=portfolio-demo-ee", body: { name: portfolio-demo-ee, image: "{{ aap_ee_image }}", pull: missing, organization: "{{ aap_ids.org }}", description: "Terraform 1.16.4, cloud.terraform, community.aws, kubernetes.core, amazon.aws" } }

    - name: Inventory
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure: { key: inv, api: controller, endpoint: inventories, query: "name={{ 'Portfolio Demo' | urlencode }}", body: { name: Portfolio Demo, organization: "{{ aap_ids.org }}" } }

    - name: Host localhost im Inventory
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure: { key: host_localhost, api: controller, endpoint: hosts, query: "name=localhost&inventory={{ aap_ids.inv }}", body: { name: localhost, inventory: "{{ aap_ids.inv }}", variables: "ansible_connection: local\nansible_python_interpreter: \"{{ '{{' }} ansible_playbook_python {{ '}}' }}\"" } }

    - name: Projekt
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure: { key: project, api: controller, endpoint: projects, query: "name=portfolio-demo", body: { name: portfolio-demo, organization: "{{ aap_ids.org }}", scm_type: git, scm_url: "{{ aap_project_repo }}", scm_branch: main, scm_update_on_launch: true, default_environment: "{{ aap_ids.ee }}" } }

    - name: Projekt aus Git aktualisieren (neue Playbooks)
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/projects/{{ aap_ids.project }}/update/"
        method: POST
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        status_code: [202]
      register: _upd
      changed_when: false

    - name: Warten, bis das Projekt-Update durch ist
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/project_updates/{{ _upd.json.id }}/"
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
      register: _pu
      until: _pu.json.status in ['successful', 'failed', 'error']
      failed_when: _pu.json.status != 'successful'
      retries: 30
      delay: 5

    - name: Warten, bis das Projekt synchronisiert ist
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/projects/{{ aap_ids.project }}/"
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
      register: _proj
      until: _proj.json.status == 'successful'
      retries: 30
      delay: 5

    # --- Job-Templates ----------------------------------------------------
    - name: "Job-Template: Terraform Plan (Drift-Check)"
      ansible.builtin.include_tasks: tasks/aap-ensure.yml
      vars:
        ensure:
          key: jt_tfplan
          api: controller
          endpoint: job_templates
          query: "name={{ 'Terraform: Plan (Drift Check)' | urlencode }}"
          body:
            name: "Terraform: Plan (Drift Check)"
            description: Runs terraform plan for one building block against the state in S3 and reports drift
            organization: "{{ aap_ids.org }}"
            project: "{{ aap_ids.project }}"
            playbook: ansible/playbooks/tf-plan.yml
            inventory: "{{ aap_ids.inv }}"
            execution_environment: "{{ aap_ids.ee }}"
            ask_variables_on_launch: true
            extra_vars: "{{ {'tf_dir': 'foundation', 'tf_variables': {'admin_cidr': (lookup('env', 'TF_VAR_admin_cidr') or (lookup('ansible.builtin.url', 'https://checkip.amazonaws.com') | trim) ~ '/32'), 'ssh_public_key': lookup('ansible.builtin.file', '~/.ssh/portfolio-demo.pub')}} | to_nice_yaml }}"

    - name: Terraform-State-Credential an das Template hängen
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/{{ aap_ids.jt_tfplan }}/credentials/"
        method: POST
        user: admin
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        body_format: json
        body: { id: "{{ aap_ids.cred_tfstate }}" }
        status_code: [204, 400]
      changed_when: false

    # --- Katalog-Templates mit Survey und RBAC ------------------------------
    - name: Katalog-Templates
      ansible.builtin.include_tasks: tasks/aap-catalog-template.yml
      loop: "{{ aap_catalog_templates }}"
      loop_control: { loop_var: jt, label: "{{ jt.name }}" }

    - name: Katalog-Workflows mit Freigabe
      ansible.builtin.include_tasks: tasks/aap-catalog-workflow.yml
      loop: "{{ aap_catalog_workflows | default([]) }}"
      loop_control: { loop_var: wf, label: "{{ wf.name }}" }

    - name: Remove retired objects with the earlier German names
      ansible.builtin.include_tasks: tasks/aap-retire.yml
      loop: "{{ (aap_retired.job_templates | default([]) | map('community.general.dict_kv', 'name') | map('combine', {'endpoint': 'job_templates'}) | list)
               + (aap_retired.workflow_job_templates | default([]) | map('community.general.dict_kv', 'name') | map('combine', {'endpoint': 'workflow_job_templates'}) | list) }}"
      loop_control: { loop_var: retired, label: "{{ retired.name }}" }

    - name: Übersicht
      ansible.builtin.debug:
        var: aap_ids
