---
# Catalog item "Database": AAP runs Terraform (cloud.terraform, own EE) for an RDS
# PostgreSQL, credentials go to Secrets Manager, an ExternalSecret goes through Git into the
# target namespace. Runs in the workflow only after approval (it costs money).
- name: Provision a database
  hosts: localhost
  gather_facts: false
  vars:
    db_name: ""
    size: small
    namespace: ""
    gitops_repo_ssh: git@github.com:maxisses/portfolio-demo.git
    gitops_repo_web: https://github.com/maxisses/portfolio-demo
    gitops_workdir: "/tmp/gitops-{{ tower_job_id | default('local') }}"
    requester: "{{ tower_user_name | default('local') }}"
    channel: "{{ 'agent' if (awx_workflow_job_launched_by_name | default(requester)) is match('^agent-') else 'portal' }}"
    request_id: "{{ tower_workflow_job_id | default(tower_job_id) | default('local') }}"
    secret_name: "portfolio-demo/dbaas/{{ db_name }}"
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - db_name is match('^[a-z][a-z0-9-]{1,30}$')
          - size in ['small', 'medium']
          - namespace is match('^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$')
        fail_msg: "Name: lowercase letters/digits/dashes; size: small or medium; give a target namespace"

    - name: Target namespace must exist on the hub
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ namespace }}"
      register: ns
      failed_when: ns.resources | length == 0

    - name: "terraform apply: RDS PostgreSQL {{ db_name }} ({{ size }})"
      cloud.terraform.terraform:
        project_path: "{{ playbook_dir }}/../../terraform/modules/dbaas"
        binary_path: /usr/local/bin/terraform
        state: present
        force_init: true
        backend_config_files:
          - "{{ lookup('ansible.builtin.env', 'TF_BACKEND_CONFIG_FILE') }}"
        backend_config:
          key: "dbaas/{{ db_name }}.tfstate"
        variables:
          name: "{{ db_name }}"
          size: "{{ size }}"
          namespace: "{{ namespace }}"
          requester: "{{ awx_workflow_job_launched_by_name | default(requester) }}"
      register: tf

    - name: Timestamp
      ansible.builtin.set_fact:
        now_utc: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y-%m-%dT%H:%MZ') }}"

    - name: Commit the ExternalSecret to Git
      ansible.builtin.include_tasks: tasks/gitops-commit.yml
      vars:
        commit:
          message: "Database {{ db_name }} for namespace {{ namespace }} (ordered via {{ channel }}, AAP workflow {{ request_id }})"
          files:
            - path: "gitops/tenants/portfolio-hub/{{ namespace }}-db-{{ db_name }}.yaml"
              content: "{{ lookup('ansible.builtin.template', '../templates/tenant-dbaas.yaml.j2') }}"

    - name: Wait until Argo CD has rolled out the commit
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: tenants-portfolio-hub
      register: app
      until: >-
        app.resources | length > 0 and
        app.resources[0].status.sync.revision | default('') == commit_sha and
        app.resources[0].status.sync.status | default('') == 'Synced'
      retries: 40
      delay: 15

    - name: Result for portal and agent
      ansible.builtin.set_stats:
        data:
          database: "{{ db_name }}"
          endpoint: "{{ tf.outputs.endpoint.value }}"
          dbname: "{{ db_name | replace('-', '_') }}"
          username: app
          password: "in secret db-{{ db_name }} in namespace {{ namespace }}, never in the job output"
          namespace: "{{ namespace }}"
          secret: "db-{{ db_name }} (keys host, port, dbname, username, password, uri)"
          git_commit: "{{ gitops_repo_web }}/commit/{{ commit_sha }}"

    - name: Summary
      ansible.builtin.debug:
        msg: "PostgreSQL {{ db_name }} is ready: endpoint {{ tf.outputs.endpoint.value }}, database {{ db_name | replace('-', '_') }}, user app. The password is in secret db-{{ db_name }} in namespace {{ namespace }}."
