---
# Resets the catalog (after tests and before the demo): removes the generated tenant files
# from Git (Argo CD deletes the namespaces, at the edge too), destroys every database ordered
# through the catalog via its own Terraform state and deletes the related secrets.
# Namespaces in "keep" stay, together with their databases.
- name: Clean up the catalog
  hosts: localhost
  gather_facts: false
  vars:
    keep: []
    gitops_repo_ssh: git@github.com:maxisses/portfolio-demo.git
    gitops_workdir: "/tmp/gitops-{{ tower_job_id | default('local') }}"
    region: eu-central-1
  tasks:
    - name: "Input 'keep' as a list (the survey delivers text)"
      # Survey values are extra vars and cannot be overridden, hence a separate name.
      ansible.builtin.set_fact:
        keep_list: "{{ ((keep | default('', true)).split(',') if (keep | default('', true)) is string else keep) | map('trim') | select | list }}"

    - name: State bucket from the Terraform backend credential
      ansible.builtin.set_fact:
        state_bucket: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'TF_BACKEND_CONFIG_FILE')) | regex_search('bucket\\s*=\\s*\"([^\"]+)\"', '\\1') | first }}"

    - name: Ordered databases (states under dbaas/)
      amazon.aws.s3_object:
        bucket: "{{ state_bucket }}"
        mode: list
        prefix: dbaas/
        region: "{{ region }}"
      register: states

    - name: Databases of kept namespaces (generated files <namespace>-db-<name>.yaml)
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../gitops/tenants/portfolio-hub"
        patterns: "{{ keep_list | map('regex_replace', '$', '-db-*.yaml') | list }}"
      register: kept_db_files
      when: keep_list | length > 0

    - name: Only databases outside the kept namespaces go
      ansible.builtin.set_fact:
        kept_dbs: >-
          {{ kept_db_files.files | default([]) | map(attribute='path') | map('basename')
             | map('regex_replace', '^.*-db-(.*)\.yaml$', '\1') | list }}
        db_states: >-
          {{ states.s3_keys | select('match', '^dbaas/.+\.tfstate$')
             | reject('in', (kept_db_files.files | default([]) | map(attribute='path') | map('basename')
                             | map('regex_replace', '^.*-db-(.*)\.yaml$', 'dbaas/\1.tfstate') | list))
             | list }}

    - name: Take the PostGIS extension out of each state (the whole database goes away anyway)
      # App tables depend on PostGIS, so dropping the extension on its own would fail.
      ansible.builtin.shell: |
        set -e
        terraform init -input=false -reconfigure -backend-config="$TF_BACKEND_CONFIG_FILE" -backend-config="key={{ item }}" >/dev/null
        terraform state rm 'postgresql_extension.postgis[0]' || true
      args:
        chdir: "{{ playbook_dir }}/../../terraform/modules/dbaas"
        executable: /bin/bash
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin"
      register: unpinned
      changed_when: "'Removed' in unpinned.stdout"
      loop: "{{ db_states }}"

    - name: Destroy databases (terraform destroy per order)
      cloud.terraform.terraform:
        project_path: "{{ playbook_dir }}/../../terraform/modules/dbaas"
        binary_path: /usr/local/bin/terraform
        state: absent
        force_init: true
        backend_config_files:
          - "{{ lookup('ansible.builtin.env', 'TF_BACKEND_CONFIG_FILE') }}"
        backend_config:
          key: "{{ item }}"
        variables:
          name: "{{ item | basename | regex_replace('\\.tfstate$', '') }}"
          namespace: cleanup
      loop: "{{ db_states }}"

    - name: Remove the state files of destroyed databases
      amazon.aws.s3_object:
        bucket: "{{ state_bucket }}"
        object: "{{ item }}"
        mode: delobj
        region: "{{ region }}"
      loop: "{{ db_states }}"

    - name: Remove generated tenant files and commit
      ansible.builtin.include_tasks: tasks/gitops-remove.yml

    - name: Delete MaaS access of AI namespaces and apps in Secrets Manager
      ansible.builtin.shell: |
        python3 - <<'PY'
        import boto3
        sm = boto3.client("secretsmanager", region_name="{{ region }}")
        keep = set({{ keep_list | to_json }})
        for page in sm.get_paginator("list_secrets").paginate(Filters=[{"Key": "name", "Values": ["portfolio-demo/ai-ns/", "portfolio-demo/apps/"]}]):
            for s in page["SecretList"]:
                ns = s["Name"].split("/")[2]
                if ns not in keep:
                    sm.delete_secret(SecretId=s["ARN"], ForceDeleteWithoutRecovery=True)
                    print("deleted:", s["Name"])
        PY
      register: sec
      changed_when: "'deleted' in sec.stdout"

    - name: Summary
      ansible.builtin.debug:
        msg: "Cleaned up: {{ db_states | length }} database(s), tenant files removed (kept: {{ keep_list | join(', ') or 'nothing' }}{{ '; databases kept: ' ~ kept_dbs | join(', ') if kept_dbs else '' }})"
