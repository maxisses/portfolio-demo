---
# Catalog item "Deploy App (Localnews)" (golden path for app teams):
# Localnews into an existing namespace on the hub, optionally with AI (location extraction
# through Granite in MaaS) and with a database ordered before. AAP issues the MaaS key,
# commits ExternalSecret and Argo CD Application to Git and waits until the app runs.
- name: Deploy Localnews
  hosts: localhost
  gather_facts: false
  vars:
    namespace: ""
    ai: "yes"
    database: ""
    cluster_domain: apps.rosa.portfolio-hub.vnid.p3.openshiftapps.com
    maas_url: https://maas.apps.rosa.portfolio-hub.vnid.p3.openshiftapps.com
    maas_model: publishers/ai-engineering/models/granite
    gitops_repo_ssh: git@github.com:maxisses/portfolio-demo.git
    gitops_repo_web: https://github.com/maxisses/portfolio-demo
    gitops_workdir: "/tmp/gitops-{{ tower_job_id | default('local') }}"
    requester: "{{ tower_user_name | default('local') }}"
    channel: "{{ 'agent' if requester is match('^agent-') else 'portal' }}"
    request_id: "{{ tower_job_id | default('local') }}"
    maas_secret: "portfolio-demo/apps/{{ namespace }}/maas"
  tasks:
    - name: Normalize input (the survey delivers text)
      # Survey values are extra vars and cannot be overridden, hence separate names.
      ansible.builtin.set_fact:
        ai_enabled: "{{ ai | string | lower in ['true', 'yes', '1'] }}"
        db_name: "{{ database | default('', true) | trim }}"

    - name: Validate input
      ansible.builtin.assert:
        that:
          - namespace is match('^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$')
          - db_name == '' or db_name is match('^[a-z][a-z0-9-]{1,30}$')
        fail_msg: "Give a namespace; leave database empty or name a database you ordered"

    - name: Namespace must exist on the hub
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ namespace }}"
      register: ns
      failed_when: ns.resources | length == 0

    - name: Ordered database must have arrived in the namespace
      when: db_name | length > 0
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ExternalSecret
        namespace: "{{ namespace }}"
        name: "db-{{ db_name }}"
      register: dbsec
      failed_when: dbsec.resources | length == 0

    - name: MaaS key for the app (subscription standard, Granite)
      when: ai_enabled | bool
      ansible.builtin.uri:
        url: "{{ maas_url }}/maas-api/v1/api-keys"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
        body_format: json
        body: { name: "app-localnews-{{ namespace }}-{{ request_id }}", subscription: standard, expiresIn: 30d }
        status_code: [200, 201]
      register: key
      no_log: true

    - name: Store MaaS access in AWS Secrets Manager
      when: ai_enabled | bool
      community.aws.secretsmanager_secret:
        name: "{{ maas_secret }}"
        region: eu-central-1
        state: present
        overwrite: true
        recovery_window: 0
        secret_type: string
        secret: "{{ {'MAAS_BASE_URL': maas_url ~ '/v1', 'MAAS_API_KEY': key.json.key, 'MAAS_MODEL': maas_model} | to_json }}"
        tags: { Project: portfolio-demo, ManagedBy: ansible }
      no_log: true

    - name: Timestamp
      ansible.builtin.set_fact:
        now_utc: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y-%m-%dT%H:%MZ') }}"

    - name: Generate YAML and commit it to Git
      ansible.builtin.include_tasks: tasks/gitops-commit.yml
      vars:
        commit:
          message: "Localnews in {{ namespace }} ({{ 'with AI' if ai_enabled | bool else 'without AI' }}{{ ', database ' ~ db_name if db_name else '' }}; ordered by {{ requester }} via {{ channel }}, AAP job {{ request_id }})"
          files:
            - path: "gitops/tenants/portfolio-hub/{{ namespace }}-app-localnews.yaml"
              content: "{{ lookup('ansible.builtin.template', '../templates/tenant-app-localnews.yaml.j2') }}"

    - name: Wait until Argo CD has picked up the order
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: tenants-portfolio-hub
      register: tapp
      until: >-
        tapp.resources | length > 0 and
        tapp.resources[0].status.sync.revision | default('') == commit_sha
      retries: 40
      delay: 15

    - name: Wait until Localnews is running
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "localnews-{{ namespace }}"
      register: app
      until: >-
        app.resources | length > 0 and
        app.resources[0].status.health.status | default('') == 'Healthy' and
        app.resources[0].status.sync.status | default('') == 'Synced'
      retries: 60
      delay: 15

    - name: Result for portal and agent
      ansible.builtin.set_stats:
        data:
          app: "https://news-frontend-{{ namespace }}.{{ cluster_domain }}"
          namespace: "{{ namespace }}"
          ai: "{{ 'location extraction through ' ~ maas_model ~ ' (MaaS, subscription standard)' if ai_enabled | bool else 'off' }}"
          database: "{{ ('db-' ~ db_name ~ ' (Amazon RDS, PostGIS)') if db_name else 'built-in PostGIS' }}"
          git_commit: "{{ gitops_repo_web }}/commit/{{ commit_sha }}"
          ordered_by: "{{ requester }} via {{ channel }}"
