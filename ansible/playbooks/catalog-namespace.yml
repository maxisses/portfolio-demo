---
# Catalog item "Namespace": generates YAML, commits it to the GitOps repository and waits
# until Argo CD has rolled it out on the target cluster (hub: push, edge: pull).
# Same path for humans (portal) and the agent (MCP).
- name: Order a namespace
  hosts: localhost
  gather_facts: false
  vars:
    ns_name: ""
    team: demo
    target_cluster: portfolio-hub
    gitops_repo_ssh: git@github.com:maxisses/portfolio-demo.git
    gitops_repo_web: https://github.com/maxisses/portfolio-demo
    gitops_workdir: "/tmp/gitops-{{ tower_job_id | default('local') }}"
    requester: "{{ tower_user_name | default('local') }}"
    channel: "{{ 'agent' if requester is match('^agent-') else 'portal' }}"
    request_id: "{{ tower_job_id | default('local') }}"
    clusters:
      portfolio-hub: "https://console-openshift-console.apps.rosa.portfolio-hub2.ocf9.p3.openshiftapps.com"
      ocp19: "https://console-openshift-console.apps.ocp19.stormshift.coe.muc.redhat.com"
      ocp20: "https://console-openshift-console.apps.ocp20.stormshift.coe.muc.redhat.com"
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - ns_name is match('^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$')
          - team is match('^[a-z0-9]([-a-z0-9]{0,20}[a-z0-9])?$')
          - target_cluster in clusters
          - not ns_name.startswith(('openshift', 'kube', 'default'))
        fail_msg: "Name/team: lowercase letters, digits, dashes. Target cluster: {{ clusters.keys() | join(', ') }}"

    - name: Timestamp
      ansible.builtin.set_fact:
        now_utc: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y-%m-%dT%H:%MZ') }}"

    - name: Generate YAML and commit it to Git
      ansible.builtin.include_tasks: tasks/gitops-commit.yml
      vars:
        commit:
          message: "Namespace {{ ns_name }} on {{ target_cluster }} (team {{ team }}; ordered by {{ requester }} via {{ channel }}, AAP job {{ request_id }})"
          files:
            - path: "gitops/tenants/{{ target_cluster }}/{{ ns_name }}.yaml"
              content: "{{ lookup('ansible.builtin.template', '../templates/tenant-namespace.yaml.j2') }}"

    - name: Wait until Argo CD has rolled out the commit on {{ target_cluster }}
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "tenants-{{ target_cluster }}"
      register: app
      until: >-
        app.resources | length > 0 and
        (app.resources[0].status.sync.revision | default('') == commit_sha or
         app.resources[0].status.operationState.startedAt | default('') > commit_time) and
        app.resources[0].status.sync.status | default('') == 'Synced'
      retries: 40
      delay: 15

    - name: Result for portal and agent
      ansible.builtin.set_stats:
        data:
          namespace: "{{ ns_name }}"
          cluster: "{{ target_cluster }}"
          team: "{{ team }}"
          console: "{{ clusters[target_cluster] }}/k8s/cluster/projects/{{ ns_name }}"
          git_commit: "{{ gitops_repo_web }}/commit/{{ commit_sha }}"
          ordered_by: "{{ requester }} via {{ channel }}"

    - name: Summary
      ansible.builtin.debug:
        msg: "Namespace {{ ns_name }} is ready on {{ target_cluster }}. Git: {{ gitops_repo_web }}/commit/{{ commit_sha }}"
