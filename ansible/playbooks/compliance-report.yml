---
# "Compliance: Record Violation": started by ACM (PolicyAutomation) as soon as a policy is
# not satisfied on clusters. ACM passes policy_name, target_clusters and policy_violations.
# The job writes a report into the repository (audit trail in Git).
- name: Record a compliance violation
  hosts: localhost
  gather_facts: false
  vars:
    policy_name: "{{ policy | default('unknown') }}"
    target_clusters: []
    policy_violations: {}
    gitops_repo_ssh: git@github.com:maxisses/portfolio-demo.git
    gitops_repo_web: https://github.com/maxisses/portfolio-demo
    gitops_workdir: "/tmp/gitops-{{ tower_job_id | default('local') }}"
  tasks:
    - name: Timestamp
      ansible.builtin.set_fact:
        now_utc: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y-%m-%dT%H:%MZ') }}"
        stamp: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%d-%H%M') }}"

    - name: Report to Git
      ansible.builtin.include_tasks: tasks/gitops-commit.yml
      vars:
        commit:
          message: "Compliance report: {{ policy_name }} not satisfied on {{ target_clusters | join(', ') or 'unknown' }} (triggered by ACM, AAP job {{ tower_job_id | default('local') }})"
          files:
            - path: "docs/compliance/{{ stamp }}-{{ policy_name | regex_replace('^.*\\.', '') }}.md"
              content: |
                # Compliance report: {{ policy_name }}

                - Time: {{ now_utc }}
                - Triggered by: ACM PolicyAutomation, run by Ansible Automation Platform (job {{ tower_job_id | default('local') }})
                - Affected clusters: {{ target_clusters | join(', ') or 'unknown' }}

                ## Violations

                {% for cluster, details in (policy_violations | default({})).items() %}
                - **{{ cluster }}**: {{ details.message | default(details) | string | truncate(400) }}
                {% else %}
                - no details passed
                {% endfor %}

                ## Next step

                Review the requirement and switch the policy to `enforce` (gitops/components/fleet).

    - name: Result
      ansible.builtin.set_stats:
        data:
          report: "{{ gitops_repo_web }}/commit/{{ commit_sha }}"
          clusters: "{{ target_clusters }}"
