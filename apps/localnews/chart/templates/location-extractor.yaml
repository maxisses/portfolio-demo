apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.locationExtractor.name }}
  labels:
    app: {{ .Values.locationExtractor.name }}
    app.openshift.io/runtime: python
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.locationExtractor.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.locationExtractor.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.locationExtractor.name }}
    spec:
      containers:
        - name: {{ .Values.locationExtractor.name }}
          image: {{ .Values.locationExtractor.image }}:{{ .Values.locationExtractor.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.locationExtractor.ports.containerPort }}
          env:
            - name: LOC_EXT_VERSION
              value: {{ .Values.locationExtractor.version | quote }}
            {{- if .Values.llm.enabled }}
            # Ortserkennung über Models-as-a-Service; Zugang aus dem Secret des Katalogs
            - name: EXTRACTOR
              value: llm
          envFrom:
            - secretRef:
                name: {{ .Values.llm.secretName }}
            {{- end }}
          resources:
            {{- toYaml .Values.locationExtractor.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.locationExtractor.ports.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.locationExtractor.ports.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.locationExtractor.name }}
  labels:
    app: {{ .Values.locationExtractor.name }}
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.locationExtractor.name }}
  ports:
    - name: http
      port: {{ .Values.locationExtractor.ports.servicePort }}
      targetPort: {{ .Values.locationExtractor.ports.containerPort }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.locationExtractor.name }}
  labels:
    app: {{ .Values.locationExtractor.name }}
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  host: {{ .Values.locationExtractor.name }}-{{ .Release.Namespace }}.{{ .Values.clusterDomain }}
  to:
    kind: Service
    name: {{ .Values.locationExtractor.name }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
