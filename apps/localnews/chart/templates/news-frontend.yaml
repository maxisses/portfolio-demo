apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.newsFrontend.name }}
  labels:
    app: {{ .Values.newsFrontend.name }}
    app.openshift.io/runtime: nodejs
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.newsFrontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.newsFrontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.newsFrontend.name }}
    spec:
      containers:
        - name: {{ .Values.newsFrontend.name }}
          image: {{ .Values.newsFrontend.image }}:{{ .Values.newsFrontend.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.newsFrontend.ports.containerPort }}
          env:
            # The frontend runs in the browser, so it needs the public URL
            # of the backend - not the in-cluster service name.
            - name: PREFIX
              value: "https://"
            - name: NODE_IP
              value: {{ .Values.newsBackend.name }}-{{ .Release.Namespace }}.{{ .Values.clusterDomain }}
            - name: NODE_PORT
              value: "443"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.newsFrontend.name }}
  labels:
    app: {{ .Values.newsFrontend.name }}
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.newsFrontend.name }}
  ports:
    - name: http
      port: {{ .Values.newsFrontend.ports.servicePort }}
      targetPort: {{ .Values.newsFrontend.ports.containerPort }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.newsFrontend.name }}
  labels:
    app: {{ .Values.newsFrontend.name }}
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  host: {{ .Values.newsFrontend.name }}-{{ .Release.Namespace }}.{{ .Values.clusterDomain }}
  to:
    kind: Service
    name: {{ .Values.newsFrontend.name }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
