{{- if not .Values.externalDatabase.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgis.name }}
  labels:
    app: {{ .Values.postgis.name }}
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.postgis.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.postgis.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.postgis.name }}
    spec:
      containers:
        - name: {{ .Values.postgis.name }}
          image: {{ .Values.postgis.image }}:{{ .Values.postgis.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.postgis.ports.containerPort }}
          env:
            - name: PGDATA
              value: /tmp/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.postgis.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgis.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgis.password }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgis.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgis.name }}
  labels:
    app: {{ .Values.postgis.name }}
    {{- include "localnews.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.postgis.name }}
  ports:
    - port: {{ .Values.postgis.ports.servicePort }}
      targetPort: {{ .Values.postgis.ports.containerPort }}
{{- end }}
