apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-models
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: default
  source:
    repoURL: https://github.com/maxisses/portfolio-demo.git
    targetRevision: main
    path: gitops/components/ai-models
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 1
