# Temporary: removes leftover banners after a test. Deleted again once all clusters are compliant.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: console-banner-cleanup
  namespace: portfolio-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: console-banner-cleanup
        spec:
          severity: low
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: console.openshift.io/v1
                kind: ConsoleNotification
                metadata:
                  name: portfolio-demo
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: console-banner-cleanup
  namespace: portfolio-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: edge
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: console-banner-cleanup
