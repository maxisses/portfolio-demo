# Version drift: edge clusters should run OpenShift 4.22.15. Inform only: the policy reports,
# the upgrade itself runs through AAP and ACM (workflow "Operations: Edge Upgrade").
# Compliant as soon as the cluster has 4.22.15 as its desired version.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: edge-minimum-version
  namespace: portfolio-policies
  annotations:
    policy.open-cluster-management.io/standards: IEC TR 62443-2-3
    policy.open-cluster-management.io/categories: Patch management
    policy.open-cluster-management.io/controls: Supported and uniform platform version
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: edge-minimum-version
        spec:
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: ClusterVersion
                metadata:
                  name: version
                status:
                  desired:
                    version: "4.22.15"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: edge-minimum-version
  namespace: portfolio-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: edge
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: edge-minimum-version
