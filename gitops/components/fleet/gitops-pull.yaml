# Argo CD on the hub knows the edge clusters through ACM (GitOpsCluster) but distributes by
# pull: ApplicationSets with pull annotations are handed to the local Argo CD of the edge
# clusters as ManifestWork. The hub needs no access to the edge APIs.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: edge
  namespace: openshift-gitops
spec:
  clusterSets: [edge]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: edge
  namespace: openshift-gitops
spec:
  argoServer:
    cluster: local-cluster
    argoNamespace: openshift-gitops
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: edge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acm-placement
  namespace: openshift-gitops
data:
  apiVersion: cluster.open-cluster-management.io/v1beta1
  kind: placementdecisions
  statusListKey: decisions
  matchKey: clusterName
