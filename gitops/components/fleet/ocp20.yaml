apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: ocp20
  labels:
    env: edge
    cluster.open-cluster-management.io/clusterset: edge
    # scripts/edge-import.sh sets apps-domain, so no lab host names end up in the repository
spec:
  hubAcceptsClient: true
---
apiVersion: agent.open-cluster-management.io/v1
kind: KlusterletAddonConfig
metadata:
  name: ocp20
  namespace: ocp20
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  clusterName: ocp20
  clusterNamespace: ocp20
  clusterLabels:
    env: edge
  applicationManager:
    enabled: true
  policyController:
    enabled: true
  searchCollector:
    enabled: true
  certPolicyController:
    enabled: true
