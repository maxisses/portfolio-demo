# New compliance requirement from IEC 62443-3-3, SR 1.12 (system use notification): every
# cluster shows a notice that it is centrally managed and for authorized use only.
# Each step is one commit:
#   1. disabled: false              -> ACM checks, reports violations, PolicyAutomation starts an AAP job
#   2. remediationAction: enforce   -> ACM enforces the requirement on hub and edge
# Reset after the demo: disabled: true, remediationAction: inform.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: console-banner
  namespace: portfolio-policies
  annotations:
    policy.open-cluster-management.io/standards: IEC 62443-3-3
    policy.open-cluster-management.io/categories: FR 1 Identification and authentication control
    policy.open-cluster-management.io/controls: SR 1.12 System use notification
spec:
  remediationAction: inform
  disabled: true
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: console-banner
        spec:
          severity: low
          # Resetting the policy (disabled: true) removes the banners it created.
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: console.openshift.io/v1
                kind: ConsoleNotification
                metadata:
                  name: portfolio-demo
                spec:
                  text: "Authorized use only · centrally managed and monitored from portfolio-hub · IEC 62443-3-3 SR 1.12"
                  location: BannerTop
                  color: "#FFFFFF"
                  backgroundColor: "#EE0000"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: console-banner
  namespace: portfolio-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: all
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: console-banner
