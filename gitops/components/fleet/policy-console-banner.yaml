# New compliance requirement: every cluster must be marked as managed in its console.
# Each step is one commit:
#   1. disabled: false              -> ACM checks, reports violations, PolicyAutomation starts an AAP job
#   2. remediationAction: enforce   -> ACM enforces the requirement on hub and edge
# Reset after the demo: disabled: true, remediationAction: inform.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: console-banner
  namespace: portfolio-policies
  annotations:
    policy.open-cluster-management.io/standards: Portfolio-Demo
    policy.open-cluster-management.io/categories: Operations
    policy.open-cluster-management.io/controls: Marking of managed clusters
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: console-banner
        spec:
          severity: low
          # Resetting the policy (disabled: true) removes the banners it created.
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: console.openshift.io/v1
                kind: ConsoleNotification
                metadata:
                  name: portfolio-demo
                spec:
                  text: "Managed by portfolio-hub · configuration from Git · policy enforced by ACM"
                  location: BannerTop
                  color: "#FFFFFF"
                  backgroundColor: "#EE0000"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: console-banner
  namespace: portfolio-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: all
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: console-banner
