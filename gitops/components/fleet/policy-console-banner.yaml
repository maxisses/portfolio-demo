# Persona Operator, "neue Compliance-Vorgabe": Alle Cluster müssen in der Konsole als
# verwaltet gekennzeichnet sein. Ablauf in der Demo, jeweils per Commit:
#   1. disabled: false   -> ACM prüft, meldet Verstöße, PolicyAutomation startet einen AAP-Job
#   2. remediationAction: enforce -> ACM setzt die Vorgabe auf Hub und Edge durch
# Zurücksetzen nach der Demo: disabled: true, remediationAction: inform.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: konsolen-banner
  namespace: portfolio-policies
  annotations:
    policy.open-cluster-management.io/standards: Portfolio-Demo
    policy.open-cluster-management.io/categories: Betrieb
    policy.open-cluster-management.io/controls: Kennzeichnung verwalteter Cluster
spec:
  remediationAction: inform
  disabled: true
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: konsolen-banner
        spec:
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: console.openshift.io/v1
                kind: ConsoleNotification
                metadata:
                  name: portfolio-demo
                spec:
                  text: "Verwaltet von portfolio-hub · Konfiguration aus Git · Policy durchgesetzt von ACM"
                  location: BannerTop
                  color: "#FFFFFF"
                  backgroundColor: "#EE0000"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: konsolen-banner
  namespace: portfolio-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: alle
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: konsolen-banner
