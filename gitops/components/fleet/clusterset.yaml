# Fleet: one ClusterSet "edge" for the two lab clusters. The clusters register themselves
# with the hub (pull), because the hub cannot reach their APIs behind the VPN.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSet
metadata:
  name: edge
spec:
  clusterSelector:
    selectorType: ExclusiveClusterSetLabel
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: edge
  namespace: openshift-gitops
spec:
  clusterSet: edge
