# Tiers: standard = the self-hosted model only, premium = self-hosted plus external models.
# Owner is every authenticated identity; the tier is set by the API key that the catalog item
# "Model Endpoint" issues for a subscription.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: standard
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Standard"
    openshift.io/description: "Only the self-hosted model"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: granite
      namespace: ai-engineering
      tokenRateLimits:
        - limit: 20000
          window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Premium"
    openshift.io/description: "Self-hosted and external models; external tokens cost money"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: granite
      namespace: ai-engineering
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: claude-haiku-4-5
      namespace: external-models
      tokenRateLimits:
        - limit: 20000
          window: 1h
    - name: claude-sonnet-5-5
      namespace: external-models
      tokenRateLimits:
        - limit: 10000
          window: 1h
    - name: claude-opus-5-5
      namespace: external-models
      tokenRateLimits:
        - limit: 5000
          window: 1h
    - name: gpt-6-luna
      namespace: external-models
      tokenRateLimits:
        - limit: 10000
          window: 1h
  priority: 20
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: external-models
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "External models"
spec:
  modelRefs:
    - name: claude-haiku-4-5
      namespace: external-models
    - name: claude-sonnet-5-5
      namespace: external-models
    - name: claude-opus-5-5
      namespace: external-models
    - name: gpt-6-luna
      namespace: external-models
  subjects:
    groups:
      - name: system:authenticated
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: self-hosted-models
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Self-hosted models"
spec:
  modelRefs:
    - name: granite
      namespace: ai-engineering
  subjects:
    groups:
      - name: system:authenticated
    users: []
