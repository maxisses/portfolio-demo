# Dashboard-Schalter für MaaS und externe Modelle (TP). Die Ressource gehört dem
# Operator; per Server-Side-Apply setzen wir nur diese Felder.
apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  dashboardConfig:
    modelAsService: true
    externalModels: true
    genAiStudio: true
    observabilityDashboard: true
