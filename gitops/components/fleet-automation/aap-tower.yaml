# ACM access to AAP (host and token of the AAP user acm-automation); value in Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aap-tower
  namespace: portfolio-policies
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: aap-tower
  dataFrom:
    - extract:
        key: portfolio-demo/aap/acm-token
