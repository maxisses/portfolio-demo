# Reaktion auf Compliance-Verstöße: Sobald die Policy "konsolen-banner" auf einem Cluster
# nicht erfüllt ist, startet ACM im AAP den Job "Compliance: Verstoß dokumentieren".
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicyAutomation
metadata:
  name: konsolen-banner-verstoss
  namespace: portfolio-policies
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  policyRef: konsolen-banner
  eventHook: noncompliant
  mode: everyEvent
  delayAfterRunSeconds: 600
  automationDef:
    name: "Compliance: Verstoß dokumentieren"
    secret: aap-tower
    type: AnsibleJob
    extra_vars:
      policy: konsolen-banner
