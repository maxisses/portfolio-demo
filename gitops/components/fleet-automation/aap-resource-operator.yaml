# AAP operator (cluster scoped) only for its resource CRDs, mainly AnsibleJob. ACM uses it to
# start jobs in the AAP on the VM: PolicyAutomation on policy violations and pre/post hooks on
# cluster upgrades (ClusterCurator). No second AAP is installed.
apiVersion: v1
kind: Namespace
metadata:
  name: aap-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap-operator
  namespace: aap-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform-operator
  namespace: aap-operator
spec:
  channel: stable-2.7-cluster-scoped
  installPlanApproval: Automatic
  name: ansible-automation-platform-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
