# Localnews auf den Edge-Clustern, im Pull-Modell. Chart aus maxisses/ice-demo, gepinnt.
# Die Routen brauchen die Apps-Domain des Zielclusters. Sie steht als Label apps-domain am
# ManagedCluster (gesetzt von scripts/edge-import.sh) und kommt über das Cluster-Secret von
# GitOpsCluster hierher; Lab-Hostnamen stehen so nicht im Repo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: localnews-edge
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            env: edge
  template:
    metadata:
      name: "localnews-{{ .name }}"
      labels:
        apps.open-cluster-management.io/pull-to-ocm-managed-cluster: "true"
      annotations:
        argocd.argoproj.io/skip-reconcile: "true"
        apps.open-cluster-management.io/ocm-managed-cluster: "{{ .name }}"
        apps.open-cluster-management.io/ocm-managed-cluster-app-namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/maxisses/ice-demo.git
        targetRevision: c4fe2e4988f69b7f3fb1684f4b2a04d94e38919b
        path: gitops/helm
        helm:
          releaseName: localnews
          valueFiles: [values.yaml, values-image.yaml]
          valuesObject:
            clusterDomain: '{{ index .metadata.labels "apps-domain" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: localnews
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
