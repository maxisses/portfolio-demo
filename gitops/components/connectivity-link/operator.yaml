# Red Hat Connectivity Link (Kuadrant: Authorino, Limitador) für MaaS: Auth und Token-Limits.
# Läuft clusterweit, daher in openshift-operators mit der vorhandenen globalen OperatorGroup.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
