# Zugriff auf AWS Secrets Manager ohne statische Keys: Der ServiceAccount eso-aws
# tauscht sein Token per STS gegen die Rolle aus terraform/platform (IRSA).
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::758277523860:role/portfolio-demo-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  # Store regelmäßig neu prüfen, damit ein Fehler nach einer Korrektur von selbst verschwindet.
  refreshInterval: 300
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws
            namespace: external-secrets
