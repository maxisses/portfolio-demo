apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: external-secrets-operator
  namespace: external-secrets-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-external-secrets-operator
  namespace: external-secrets-operator
spec:
  channel: stable-v1.2
  installPlanApproval: Automatic
  name: openshift-external-secrets-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# Schaltet den Operand (Controller, Webhook) im Namespace external-secrets ein.
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  controllerConfig:
    # Der Operator isoliert ESO standardmäßig per Deny-All. Der Controller darf
    # zusätzlich nur ausgehend HTTPS (AWS STS und Secrets Manager).
    networkPolicies:
      - name: allow-egress-https
        componentName: ExternalSecretsCoreController
        egress:
          - ports:
              - protocol: TCP
                port: 443
