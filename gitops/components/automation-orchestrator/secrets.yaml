# Zugangsdaten im Format, das der Operator erwartet (Schlüssel database, username, password).
# Werte aus Secrets Manager (terraform/platform), nichts davon in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-pg-credentials
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: orchestrator-pg-credentials
    template:
      data:
        database: orchestrator
        username: orchestrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: portfolio-demo/orchestrator/db, property: ORCHESTRATOR_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-pg-credentials
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: temporal-pg-credentials
    template:
      data:
        database: temporal
        username: temporal
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: portfolio-demo/orchestrator/db, property: TEMPORAL_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-admin
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: orchestrator-admin
  data:
    - secretKey: password
      remoteRef: { key: portfolio-demo/orchestrator/admin, property: password }
---
# Known Issue 2026.8: Der Operator verlangt pg-ca-cert auch bei sslMode disable. Platzhalter, kein Geheimnis.
apiVersion: v1
kind: Secret
metadata:
  name: pg-ca-cert
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  ca.crt: "placeholder, sslMode is disable"
