# Zugang von AAP zum Hub: nur lesen, was AAP nach einer Bestellung prüfen muss
# (Namespaces, Argo-CD-Apps, ACM-Status). Ändern tut AAP nichts direkt, sondern über Git.
apiVersion: v1
kind: Namespace
metadata:
  name: aap-automation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap
  namespace: aap-automation
---
# Langlebiges Token; den Wert trägt Kubernetes ein, er steht nie in Git.
apiVersion: v1
kind: Secret
metadata:
  name: aap-token
  namespace: aap-automation
  annotations:
    kubernetes.io/service-account.name: aap
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aap-catalog-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets]
    verbs: [get, list, watch]
  # Nach einem Commit sofort neu einlesen lassen (statt auf das Polling zu warten)
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [patch]
  - apiGroups: [apps.open-cluster-management.io]
    resources: [multiclusterapplicationsetreports]
    verbs: [get, list, watch]
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclusters]
    verbs: [get, list, watch]
  # App-Bestellung: prüfen, ob die bestellte Datenbank im Namespace angekommen ist
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list]
  # AI-Namespace: aktuelles Workbench-Image aus dem RHOAI-ImageStream
  - apiGroups: [image.openshift.io]
    resources: [imagestreams]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aap-catalog-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aap-catalog-reader
subjects:
  - kind: ServiceAccount
    name: aap
    namespace: aap-automation
---
# Edge-Upgrades: AAP legt ClusterCurator in den Cluster-Namespaces des Hubs an, ACM führt aus.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aap-fleet-upgrade
rules:
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [clustercurators]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-fleet-upgrade
  namespace: ocp19
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aap-fleet-upgrade
subjects:
  - kind: ServiceAccount
    name: aap
    namespace: aap-automation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-fleet-upgrade
  namespace: ocp20
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aap-fleet-upgrade
subjects:
  - kind: ServiceAccount
    name: aap
    namespace: aap-automation
