# Ansible Automation Portal (Self-Service-Front-Door, RHDH-basiert).
# Zugangsdaten zu AAP und zur Plugin-Registry kommen aus AWS Secrets Manager
# (angelegt von ansible/playbooks/portal-aap.yml).
apiVersion: v1
kind: Namespace
metadata:
  name: aap-portal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-rhaap-portal
  namespace: aap-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: secrets-rhaap-portal
  dataFrom:
    - extract:
        key: portfolio-demo/portal/aap
---
# Name folgt dem Muster <release-name>-dynamic-plugins-registry-auth
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redhat-rhaap-portal-dynamic-plugins-registry-auth
  namespace: aap-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: redhat-rhaap-portal-dynamic-plugins-registry-auth
  data:
    - secretKey: auth.json
      remoteRef:
        key: portfolio-demo/portal/registry-auth
