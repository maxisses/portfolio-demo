# App-of-Apps: alles unter gitops/platform wird von Argo CD verwaltet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/maxisses/portfolio-demo.git
    targetRevision: main
    path: gitops/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
