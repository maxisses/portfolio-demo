# Argo CD verwaltet die Plattform (Operatoren, ACM, RHOAI) und braucht dafür
# clusterweite Rechte. Für eine Demo vertretbar; in Produktion feiner schneiden.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
