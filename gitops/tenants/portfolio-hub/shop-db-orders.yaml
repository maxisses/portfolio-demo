# Zugangsdaten liegen in AWS Secrets Manager (portfolio-demo/dbaas/orders); hier steht nur der Verweis.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-orders
  namespace: shop
  labels:
    portfolio-demo/managed-by: aap
    portfolio-demo/ordered-by: agent
    portfolio-demo/request-id: "65"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-orders
  dataFrom:
    - extract:
        key: portfolio-demo/dbaas/orders
