# Erzeugt von AAP (Katalog-Item "App bereitstellen: Localnews"). Nicht von Hand ändern.
# Bestellt von agent-claude über agent, AAP-Job 71, 2026-10-01T09:42Z
# Zugang zu Models-as-a-Service für die App; Wert in AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maas-zugang
  namespace: shop
  labels:
    portfolio-demo/managed-by: aap
    portfolio-demo/request-id: "71"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: maas-zugang
  dataFrom:
    - extract:
        key: portfolio-demo/apps/shop/maas
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localnews-shop
  namespace: openshift-gitops
  labels:
    portfolio-demo/managed-by: aap
    portfolio-demo/ordered-by: agent
    portfolio-demo/request-id: "71"
spec:
  project: default
  source:
    repoURL: https://github.com/maxisses/portfolio-demo.git
    targetRevision: main
    path: apps/localnews/chart
    helm:
      releaseName: localnews
      valueFiles: [values.yaml]
      valuesObject:
        clusterDomain: apps.rosa.portfolio-hub.vnid.p3.openshiftapps.com
        locationExtractor:
          image: image-registry.openshift-image-registry.svc:5000/localnews-build/location-extractor
          imageTag: llm
        llm:
          enabled: true
          secretName: maas-zugang
        externalDatabase:
          enabled: true
          secretName: "db-orders"
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 1
